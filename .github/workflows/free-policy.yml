name: free-policy

# 本ワークフローは genzouw/ci-workflows の reusable workflow を呼び出す薄いスタブ。
# ロジックの実体・変更は ci-workflows 側で一元管理する (トリガー定義のみここで持つ)。
# 参照 SHA の更新は Dependabot (github-actions ecosystem) が自動で PR を出す。
# 将来 必須チェック (context: "free-policy / Free-only policy check") にする想定のため
# paths フィルタは付けない。
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: free-policy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  free-policy:
    # enforce は既定の true。違反を検出した PR は job が失敗する。
    # 観察期間 (2026-09-12 導入〜) に警告の発生はゼロだったため警告のみ運用を終了した (#17)。
    uses: genzouw/ci-workflows/.github/workflows/free-policy.yml@eb84d0c974989515c0b26acc055948416f256533 # v1.1.1
