name: free-policy

# 本ワークフローは genzouw/ci-workflows の reusable workflow を呼び出す薄いスタブ。
# ロジックの実体・変更は ci-workflows 側で一元管理する (トリガー定義のみここで持つ)。
# 参照 SHA の更新は Renovate (github-actions manager) が自動で PR を出す。
# 参照する版を上げるときは AGENTS.md 1.5 節 (走査対象・検出内容・例外の指定) を見直す。
# 1.5 節は ci-workflows の挙動の写しで、SHA の更新には追随しないため。
# main の必須チェック (context: "free-policy / Free-only policy check") のため
# paths フィルタは付けない (フィルタで skip されると context が報告されずマージできなくなる)。
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: free-policy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  free-policy:
    # enforce は既定の true。違反を検出した PR は job が失敗する。
    # 観察期間 (2026-09-12 導入〜) に警告の発生はゼロだったため警告のみ運用を終了した (#17)。
    uses: genzouw/ci-workflows/.github/workflows/free-policy.yml@3223ebdaffdf89c60ee0bdf615f76ee8037a1c83 # v1.5.0
